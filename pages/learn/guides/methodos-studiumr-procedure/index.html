    function readLocale() {
      try {
        const saved = localStorage.getItem(KEY) || localStorage.getItem(GUIDE_KEY);
        if (saved && UI[saved]) return saved;
      } catch (_) {}
      return "ko";
    }

    function writeLocale(locale) {
      try {
        localStorage.setItem(KEY, locale);
        localStorage.setItem(GUIDE_KEY, locale);
      } catch (_) {}
    }

    function applyChrome(locale) {
      const pack = UI[locale] || UI.ko;
      document.documentElement.lang = locale === "zh" ? "zh-CN" : locale;
      document.title = pack.title + " · Methodos Lab";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const k = el.getAttribute("data-i18n");
        if (pack[k] != null) el.textContent = pack[k];
      });
      document.querySelectorAll(".lang-switch__btn").forEach((btn) => {
        const on = btn.dataset.locale === locale;
        btn.classList.toggle("is-on", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    function mount(locale) {
      const root = document.querySelector("#guide-root");
      root.innerHTML = "";
      MethodosProcedure.mount("#guide-root", { sections: SECTIONS[locale] || SECTIONS.ko });
    }

    function apply(locale) {
      if (!UI[locale]) locale = "ko";
      writeLocale(locale);
      applyChrome(locale);
      mount(locale);
    }

    document.querySelectorAll(".lang-switch__btn").forEach((btn) => {
      btn.addEventListener("click", () => apply(btn.dataset.locale));
    });

    document.addEventListener("DOMContentLoaded", function () {
      apply(readLocale());
    });
  })();
